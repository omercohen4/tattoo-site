# השאלות הנפוצות
title: שאלות נפוצות
questions:
- question: כמה עולה קעקוע?
  answer: המחיר נקבע בהתאם לגודל הקעקוע, רמת המורכבות, מיקום הקעקוע בגוף וזמן העבודה הנדרש. כדי לקבל הצעת מחיר מדויקת, אפשר לשלוח לי תמונה להשראה, מיקום רצוי וגודל משוער.
- question: האם צריך לשלם מקדמה?
  answer: כן, לצורך שריון מועד נקבעת מקדמה מראש. סכום המקדמה ותנאי הביטול יימסרו בעת תיאום התור.
- question: מאיזה גיל אפשר לעשות קעקוע?
  answer: ניתן לתאם קעקוע בהתאם לדרישות החוק ולמדיניות הסטודיו. מומלץ ליצור קשר מראש כדי לוודא התאמה.
- question: האם קעקוע כואב?
  answer: תחושת הכאב משתנה מאדם לאדם ותלויה גם במיקום הקעקוע, בגודל שלו ובמשך העבודה. במהלך המפגש חשוב להרגיש בנוח ולעדכן אותי אם צריך הפסקה.
- question: איך מטפלים בקעקוע לאחר סיום העבודה?
  answer: טיפול נכון הוא חלק חשוב מתהליך ההחלמה. לאחר הקעקוע תקבלו הנחיות לטיפול.
- question: כמה זמן לוקח לקעקוע להחלים?
  answer: זמן ההחלמה משתנה בהתאם לגודל הקעקוע, למיקום שלו ולגוף של כל אדם. חשוב להקפיד על הוראות הטיפול לאורך כל תקופת ההחלמה ולא לקלף גלדים או לגרד את האזור.
- question: אפשר להגיע עם רעיון משלי?
  answer: בהחלט. אפשר להגיע עם רעיון, תמונת השראה או כיוון כללי. יחד נדייק את העיצוב ונבנה קונספט שמתאים לכם, לסגנון הרצוי ולמיקום בגוף.
- question: איך קובעים תור?
  answer: פשוט יוצרים איתי קשר, שולחים את הרעיון או ההשראה שלכם, מציינים את המיקום והגודל המשוערים, ומשם נתקדם לתכנון הקעקוע ולתיאום מועד.
