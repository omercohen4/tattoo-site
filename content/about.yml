# החלק "היי, אני סהר"
title: היי, אני סהר
lead: מבחינתי, קעקוע הוא הרבה מעבר לדיו על העור. הוא שילוב של אמנות, דיוק, יצירתיות וסיפור אישי.
paragraphs:
- אני מאמין שכל קעקוע צריך להיות ייחודי, כזה שמתחבר לאדם שעונד אותו ומשקף את מי שהוא. מהרעיון הראשוני ועד לקו האחרון, כל פרט מקבל את מלוא תשומת הלב.
- המטרה שלי היא ליצור עבודות עם אופי, נוכחות ומשמעות — כאלה שנראות מדהים היום ויישארו מרשימות גם בעוד שנים.
