# החלק "איך זה עובד?"
title: איך זה עובד?
steps:
- title: מתחילים ברעיון
  text: כל קעקוע מתחיל ברעיון, השראה או סיפור אישי. יחד נבין מה אתם מחפשים ונגבש כיוון עיצובי שמתאים בדיוק לכם.
- title: מעצבים יחד
  text: אני בונה את הקונספט בהתאם לרעיון שלכם, תוך הקפדה על פרופורציות, קומפוזיציה ודיוק בכל פרט — עד שנגיע לעיצוב הנכון.
- title: שומרים תאריך
  text: אחרי שסוגרים את הפרטים, מתאמים מועד לקעקוע ומכינים את כל מה שצריך לקראת המפגש.
- title: מקעקעים
  text: כאן הרעיון הופך למציאות. אני מקפיד על עבודה מדויקת, סביבת עבודה נקייה וסטרילית והנחיות ברורות לטיפול בקעקוע לאחר סיום העבודה.
