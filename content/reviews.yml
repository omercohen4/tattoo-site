# הביקורות בחלק "מה אומרים עליי"
title: מה אומרים עליי
items:
- name: נועה ל.
  work: שושן · ירך
  text: הגעתי עם רעיון מעורפל של פרחים, וסהר הפך אותו לעיצוב שאני לא מפסיקה להסתכל עליו. הקווים עדינים ונקיים בדיוק כמו שרציתי.
- name: איתי מ.
  work: לוחם ספרטני · ירך
  text: היה לי חשש מקעקוע גדול ראשון. סהר הסביר כל שלב, עצר כשהייתי צריך הפסקה, והתוצאה פשוט מטורפת.
- name: מאיה ר.
  work: אדמונית · כתף
  text: סטודיו נקי, יחס אישי ואפס לחץ. ישבנו על הסקיצה עד שהיא הייתה מושלמת, והקעקוע החלים יפה מאוד.
- name: דניאל כ.
  work: כריש לווייתני · ירך
  text: רציתי משהו שאף אחד אחר לא יקבל. סהר צייר לי עיצוב מאפס, והפרטים הקטנים הם מה שעושה אותו.
- name: שירה א.
  work: כתב יד · אמה
  text: כבר הקעקוע השלישי שלי אצל סהר וזה לא האחרון. דייקן, סבלני ותמיד עם הנחיות ברורות לטיפול אחרי.
