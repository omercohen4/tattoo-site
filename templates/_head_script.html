  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      // הגדרות הנגישות שהמבקר בחר בביקור קודם, לפני שהעמוד מצויר
      var a11y = {};
      try { a11y = JSON.parse(localStorage.getItem('a11y')) || {}; } catch (e) {}
      if (a11y.text) root.classList.add('a11y-t' + a11y.text);
      ['contrast', 'links', 'font', 'calm'].forEach(function (k) { if (a11y[k]) root.classList.add('a11y-' + k); });
      if (!a11y.calm && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        root.classList.add('motion'{% if intro %}, 'intro'{% endif %});
        {%- if intro %}
        // רשת ביטחון: אם הסקריפט לא רץ, התוכן מופיע בכל זאת
        setTimeout(function () { root.classList.remove('intro'); }, 3000);
        {%- endif %}
      }
    })();
  </script>
